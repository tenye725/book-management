version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21

  build:
    commands:
      - cd book-management-api
      - chmod +x gradlew
      - ./gradlew bootJar -x test

  post_build:
    commands:
      - mkdir -p ../deploy-backend
      - cp build/libs/*-SNAPSHOT.jar ../deploy-backend/app.jar
      - cp Procfile ../deploy-backend/
      - '[ -d .ebextensions ] && cp -r .ebextensions ../deploy-backend/ || true'
      - cd ..
      - ls -la deploy-backend/

artifacts:
  files:
    - '**/*'
  base-directory: deploy-backend
  discard-paths: no